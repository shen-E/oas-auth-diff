openapi: 3.1.1
info:
  title: Warehouse API
  version: 1.0.0
servers:
  - url: https://auth.example.test/oauth/
components:
  securitySchemes:
    warehouse:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: token
          scopes:
            stock:read: Read stock
            stock:write: Update stock
paths:
  /stock:
    get:
      security:
        - warehouse: [stock:read, stock:write]
      responses:
        '200':
          description: Stock listing
